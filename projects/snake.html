<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="p.css"><title>Snake | Prashishya Parajuli</title>
<style>.embed canvas{max-width:320px}canvas{display:block;width:100%;max-width:400px;margin:0 auto;border:1px solid var(--line);background:#000;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,3.2rem);gap:.4rem;justify-content:center;margin-top:1rem}.pad .btn{padding:.6rem 0}.bar{display:flex;justify-content:space-between;font:700 .95rem var(--mono);margin-bottom:.6rem}</style></head><body><script>if(top!==self){document.documentElement.className="embed";addEventListener("keydown",function(e){if(e.key==="Escape")parent.postMessage("close-preview","*")})}</script><main><a class="back" href="../#projects">&larr; Back to portfolio</a>
<h1>Snake</h1>
<p class="note">Built with Claude, guided by Prashishya. Arrow keys or WASD to move, Space to start.</p>
<div class="box">
<div class="bar"><span id="sc">Score 0</span><span id="bs">Best 0</span></div>
<canvas id="c" width="400" height="400" aria-label="Snake game board"></canvas>
<div class="pad">
<span></span><button class="btn" data-d="0,-1" aria-label="Up">&uarr;</button><span></span>
<button class="btn" data-d="-1,0" aria-label="Left">&larr;</button><button class="btn" id="go">Go</button><button class="btn" data-d="1,0" aria-label="Right">&rarr;</button>
<span></span><button class="btn" data-d="0,1" aria-label="Down">&darr;</button><span></span>
</div></div></main>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),G=20,S=20,snake,dir,nxt,food,score=0,best=0,timer,alive=false;
function place(){do{food={x:Math.random()*G|0,y:Math.random()*G|0}}while(snake.some(function(s){return s.x==food.x&&s.y==food.y}))}
function start(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nxt={x:1,y:0};score=0;place();alive=true;clearInterval(timer);timer=setInterval(step,110);draw();}
function end(){alive=false;clearInterval(timer);best=Math.max(best,score);draw();}
function step(){
  dir=nxt;var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=G||h.y>=G||snake.some(function(s){return s.x==h.x&&s.y==h.y}))return end();
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){score++;place();}else snake.pop();
  draw();
}
function draw(){
  x.fillStyle='#000';x.fillRect(0,0,400,400);
  if(snake){x.fillStyle='#ff3b4a';x.beginPath();x.arc(food.x*S+10,food.y*S+10,7,0,7);x.fill();
    snake.forEach(function(s,i){x.fillStyle=i?'#ffb0b6':'#ff8a93';x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});}
  x.fillStyle='#ff7882';x.font='700 18px monospace';x.textAlign='center';
  if(!alive)x.fillText(snake?'Game over. Press Space':'Press Space or Go',200,200);
  document.getElementById('sc').textContent='Score '+score;document.getElementById('bs').textContent='Best '+best;
}
function turn(dx,dy){if(dx!==-dir.x||dy!==-dir.y)nxt={x:dx,y:dy};}
var keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();if(!alive)start();return;}
  var k=keys[e.key];if(k&&alive){e.preventDefault();turn(k[0],k[1]);}
});
document.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){var d=b.dataset.d.split(',');if(alive)turn(+d[0],+d[1]);});});
document.getElementById('go').addEventListener('click',function(){if(!alive)start();});
draw();
</script></body></html>
