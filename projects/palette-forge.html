<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="p.css"><title>Palette Forge | Prashishya Parajuli</title>
<style>main{max-width:46rem}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}select{font:400 .9rem var(--mono);color:var(--ink);background:var(--bar);border:1px solid var(--line);padding:.55rem}#sw{display:grid;grid-template-columns:repeat(5,1fr);margin:1rem 0;border:1px solid var(--line)}.sw{display:flex;flex-direction:column;height:15rem}.pick{flex:1;border:0;cursor:pointer;font:700 .8rem var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.2rem;padding:.6rem 0;color:inherit;background:transparent}.pick small{font-weight:400}.lk{border:0;border-top:1px solid rgba(0,0,0,.25);cursor:pointer;padding:.45rem 0;font:400 .75rem var(--mono);background:rgba(0,0,0,.18);color:inherit}.lk[aria-pressed=true]{font-weight:700;background:rgba(0,0,0,.4)}.pick:focus-visible,.lk:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}#pv{padding:1.2rem;border:1px solid var(--line)}#pv h2{font:700 1.2rem var(--mono);margin:0 0 .4rem}#pv p{margin:0 0 .8rem}#pv span{display:inline-block;padding:.45rem .9rem;font:700 .85rem var(--mono)}@media(max-width:560px){#sw{grid-template-columns:1fr}.sw{height:3.4rem;flex-direction:row}.pick{flex-direction:row;justify-content:center;align-items:center;gap:.8rem}.lk{width:5rem;border-top:0;border-left:1px solid rgba(0,0,0,.25)}}</style></head><body><script>if(top!==self){document.documentElement.className="embed";addEventListener("keydown",function(e){if(e.key==="Escape")parent.postMessage("close-preview","*")})}</script><main><a class="back" href="../#projects">&larr; Back to portfolio</a>
<h1>Palette Forge</h1>
<p class="note">Built with Claude, guided by Prashishya. Space = new palette. Click a colour to copy it. Lock the ones you like.</p>
<div class="row"><select id="mode" aria-label="Colour harmony"><option>Surprise me</option><option>Analogous</option><option>Complementary</option><option>Triadic</option><option>Random</option></select><button class="btn" id="gen" type="button">New palette</button><button class="btn alt" id="css" type="button">Copy CSS</button><button class="btn alt" id="lnk" type="button">Copy share link</button></div>
<div id="sw"></div>
<p id="msg" class="note" role="status" aria-live="polite">&nbsp;</p>
<div id="pv"><h2>Live preview</h2><p>This sample card uses your palette: lightest as background, darkest for the title.</p><span>Button</span></div>
</main>
<script>
var $=function(i){return document.getElementById(i)},cols=[],lock=[0,0,0,0,0];
var modes={Analogous:[0,25,50,-25,-50],Complementary:[0,15,180,195,165],Triadic:[0,120,240,60,180]},L=[20,38,56,74,90];
function hex(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')}return'#'+f(0)+f(8)+f(4)}
function lum(c){var r=[1,3,5].map(function(i){var v=parseInt(c.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r[0]+.7152*r[1]+.0722*r[2]}
function best(c){var l=lum(c),w=1.05/(l+.05),b=(l+.05)/.05;return w>b?{t:'#fff',r:w}:{t:'#000',r:b}}
function grade(r){return r>=7?'AAA':r>=4.5?'AA':r>=3?'AA large':'low'}
function gen(){
  var m=$('mode').value;if(m==='Surprise me')m=['Analogous','Complementary','Triadic'][Math.random()*3|0];
  var base=Math.random()*360,s=45+Math.random()*40,o=modes[m];
  for(var i=0;i<5;i++)if(!lock[i])cols[i]=hex((base+(o?o[i]:Math.random()*360)+360)%360,s,L[i]);
  render();$('msg').textContent=m+' palette';
}
function render(){
  var w=$('sw');w.innerHTML='';
  cols.forEach(function(c,i){
    var b=best(c),d=document.createElement('div');d.className='sw';d.style.background=c;d.style.color=b.t;
    var p=document.createElement('button');p.className='pick';p.innerHTML=c.toUpperCase()+'<small>'+b.r.toFixed(1)+':1 '+grade(b.r)+'</small>';
    p.onclick=function(){copy(c.toUpperCase(),'Copied '+c.toUpperCase())};
    var k=document.createElement('button');k.className='lk';k.textContent=lock[i]?'Locked':'Lock';k.setAttribute('aria-pressed',!!lock[i]);
    k.onclick=function(){lock[i]=lock[i]?0:1;render()};
    d.appendChild(p);d.appendChild(k);w.appendChild(d);
  });
  var pv=$('pv'),bt=pv.querySelector('span');pv.style.background=cols[4];pv.querySelector('h2').style.color=cols[0];pv.querySelector('p').style.color=cols[1];bt.style.background=cols[2];bt.style.color=best(cols[2]).t;
  history.replaceState(null,'','#'+cols.map(function(c){return c.slice(1)}).join('-'));
}
function copy(t,m){try{navigator.clipboard.writeText(t).then(function(){$('msg').textContent=m})}catch(e){$('msg').textContent=t}}
$('gen').onclick=gen;
$('css').onclick=function(){copy(':root{\n'+cols.map(function(c,i){return'  --color-'+(i+1)+': '+c+';'}).join('\n')+'\n}','Copied CSS variables')};
$('lnk').onclick=function(){copy(location.href,'Copied share link')};
document.addEventListener('keydown',function(e){if(e.key===' '&&!/BUTTON|SELECT/.test(e.target.tagName)){e.preventDefault();gen()}});
var h=location.hash.slice(1);
if(/^([0-9a-f]{6}-){4}[0-9a-f]{6}$/i.test(h)){cols=h.split('-').map(function(x){return'#'+x.toLowerCase()});render();$('msg').textContent='Loaded shared palette'}else gen();
</script></body></html>
