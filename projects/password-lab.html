<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="p.css"><title>Password Lab | Prashishya Parajuli</title>
<style>.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.row input[type=text],.row input[type=password]{flex:1;min-width:12rem}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}#track{height:.7rem;background:var(--bar);border:1px solid var(--line);margin:.8rem 0 .4rem}#bar{height:100%;width:0;background:var(--accent);transition:width .2s,background .2s}ul{list-style:none;margin:.4rem 0 0;padding:0;font:400 .9rem var(--mono)}li.ok{color:var(--mint)}li.no{color:var(--muted)}h2{font:700 1rem var(--mono);color:var(--head);margin:0 0 .5rem}table{width:100%;border-collapse:collapse;font:400 .85rem var(--mono)}td{padding:.35rem 0;border-top:1px solid var(--line)}td+td{text-align:right;color:var(--mint)}label.s{font:400 .85rem var(--mono)}input[type=range]{width:auto;padding:0;accent-color:var(--accent)}</style></head><body><script>if(top!==self){document.documentElement.className="embed";addEventListener("keydown",function(e){if(e.key==="Escape")parent.postMessage("close-preview","*")})}</script><main><a class="back" href="../#projects">&larr; Back to portfolio</a>
<h1>Password Lab</h1>
<p class="note">Built with Claude, guided by Prashishya. Nothing you type leaves this page.</p>
<div class="box">
<label for="pw">Test a password (don't use a real one)</label>
<div class="row"><input id="pw" type="password" autocomplete="off" spellcheck="false"><button class="btn alt" id="cp" type="button">Copy</button></div>
<p><label class="s"><input type="checkbox" id="show" style="width:auto"> Show password</label></p>
<div id="track"><div id="bar"></div></div>
<p id="out" role="status" aria-live="polite">Type something to test it.</p>
<ul id="chk"></ul>
</div>
<div class="box"><h2>If an attacker tried to crack it</h2><table id="tm"></table></div>
<div class="box"><h2>Generate a strong one</h2>
<div class="row"><label class="s" for="len">Length <b id="lv">16</b></label><input type="range" id="len" min="12" max="32" value="16"><label class="s"><input type="checkbox" id="sym" checked style="width:auto"> Symbols</label><button class="btn" id="gen" type="button">Generate</button></div>
<p class="note">Made with your browser's secure random generator.</p></div>
</main>
<script>
var $=function(i){return document.getElementById(i)},pw=$('pw');
var common=['password','qwerty','letmein','admin','welcome','iloveyou','monkey','dragon','football','master','login','nepal','kathmandu','everest','pokhara','namaste','secret','princess','sunshine','shadow','hello','freedom','whatever','trustno1','starwars','minecraft','roblox','fortnite'];
var rows=['qwertyuiop','asdfghjkl','zxcvbnm','1234567890','abcdefghijklmnopqrstuvwxyz'];
var cols=['#5a1a21','#d4515c','#ff7882','#ffb0b6','#ffffff'];
function norm(v){return v.toLowerCase().replace(/@/g,'a').replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[$5]/g,'s').replace(/7/g,'t')}
function hasSeq(v){var l=v.toLowerCase();return rows.some(function(r){for(var i=0;i<=r.length-4;i++){var s=r.substr(i,4);if(l.indexOf(s)>-1||l.indexOf(s.split('').reverse().join(''))>-1)return true}return false})}
function fmt(s){if(s<1)return'instantly';if(s<60)return Math.round(s)+' seconds';var m=s/60;if(m<60)return Math.round(m)+' minutes';var h=m/60;if(h<24)return Math.round(h)+' hours';var d=h/24;if(d<365)return Math.round(d)+' days';var y=d/365;return y<1e6?Math.round(y).toLocaleString()+' years':'millions of years+'}
var rates=[['Online login (100 guesses/sec)',100],['Stolen database, slow hash (10 thousand/sec)',1e4],['Stolen database, fast hash (10 billion/sec)',1e10]];
function check(){
  var v=pw.value,n=v.length;
  if(!n){$('bar').style.width='0';$('out').textContent='Type something to test it.';$('chk').innerHTML='';$('tm').innerHTML='';return}
  var up=/[A-Z]/.test(v),lo=/[a-z]/.test(v),di=/\d/.test(v),sy=/[^A-Za-z0-9]/.test(v);
  var pool=(lo?26:0)+(up?26:0)+(di?10:0)+(sy?32:0),bits=n*Math.log2(pool);
  var word=common.some(function(w){return v.toLowerCase().indexOf(w)>-1||norm(v).indexOf(w)>-1}),seq=hasSeq(v),rep=/(.)\1\1/.test(v),yr=/(19|20)\d\d/.test(v);
  if(word)bits*=.45;if(seq)bits*=.75;if(rep)bits*=.7;if(yr)bits-=8;bits=Math.max(1,bits);
  var lvl=bits<28?0:bits<36?1:bits<60?2:bits<80?3:4,names=['Very weak','Weak','Okay','Strong','Excellent'];
  $('bar').style.width=Math.min(100,bits/1.1)+'%';$('bar').style.background=cols[lvl];
  $('out').textContent=names[lvl]+' · about '+Math.round(bits)+' bits of strength';
  var items=[['12 or more characters',n>=12],['Upper and lower case',up&&lo],['Has a number',di],['Has a symbol',sy],['No common words (even p@ssw0rd tricks)',!word],['No runs like 1234 or qwer',!seq],['No repeats like aaa',!rep],['No year like 2005',!yr]];
  $('chk').innerHTML=items.map(function(i){return'<li class="'+(i[1]?'ok':'no')+'">['+(i[1]?'x':' ')+'] '+i[0]+'</li>'}).join('');
  $('tm').innerHTML=rates.map(function(r){return'<tr><td>'+r[0]+'</td><td>'+fmt(Math.pow(2,bits)/2/r[1])+'</td></tr>'}).join('');
}
function rnd(n){var a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function gen(){
  var len=+$('len').value,sy=$('sym').checked,set='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'+(sy?'!@#$%^&*-_=+?':''),p;
  do{p='';for(var i=0;i<len;i++)p+=set[rnd(set.length)]}while(!(/[a-z]/.test(p)&&/[A-Z]/.test(p)&&/\d/.test(p)&&(!sy||/[^A-Za-z0-9]/.test(p))));
  pw.value=p;$('show').checked=true;pw.type='text';check();
}
pw.addEventListener('input',check);
$('show').onchange=function(){pw.type=this.checked?'text':'password'};
$('len').oninput=function(){$('lv').textContent=this.value};
$('gen').onclick=gen;
$('cp').onclick=function(){var b=this;try{navigator.clipboard.writeText(pw.value).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1200)})}catch(e){}};
</script></body></html>
